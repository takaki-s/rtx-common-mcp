<!DOCTYPE html>
<html>
<head>
<title>show ip route</title>
</head>
<body id="show_ip_route">
<h1 class="title topictitle1">show ip route</h1>
<div class="body refbody">
  <div class="section">
    <h2 class="title sectiontitle">[書式]</h2>
    <ul class="sl simple">
      <li class="sli">show ip route [destination]</li>
      <li class="sli">show ip route detail</li>
      <li class="sli">show ip route summary</li>
    </ul>
  </div>
  <div class="section">
    <h2 class="title sectiontitle">[設定値及び初期値]</h2>
    <ul class="ul">
      <li class="li"><var class="keyword varname">destination</var>
        <ul class="ul">
          <li class="li"><span class="ph">[設定値] : 宛先 IP アドレス</span></li>
          <li class="li"><span class="ph">[初期値] : -</span></li>
        </ul>
      </li>
    </ul>
  </div>
  <div class="section">
    <h2 class="title sectiontitle">[説明]</h2>
    <p>IP 経路情報テーブルを表示するコマンド。</p>
  </div>
  <div class="section">
    <h2 class="title sectiontitle">[適用モデル]</h2>
    <span class="ph">RTX1300, RTX1210</span>
  </div>
</div>
</body>
</html>
